---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown viewer</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; display: flex; height: 100vh; }
  #side { width: 280px; padding: 10px; border-right: 1px solid #ddd; overflow-y: auto; box-sizing: border-box; }
  #side select, #side input { width: 100%; margin-bottom: 8px; box-sizing: border-box; }
  #files a { display: block; padding: 2px 4px; text-decoration: none; color: #0366d6; cursor: pointer; }
  #files a.active { background: #eef; font-weight: bold; }
  #content { flex: 1; padding: 20px 30px; overflow-y: auto; line-height: 1.5; }
  #content pre { background: #f6f8fa; padding: 10px; overflow-x: auto; }
  #content code { background: #f6f8fa; }
  #content table { border-collapse: collapse; }
  #content td, #content th { border: 1px solid #ccc; padding: 4px 8px; }
  #content img { max-width: 100%; }
</style>
</head>
<body>
<div id="side">
  <select id="dir"></select>
  <input id="filter" placeholder="Filter files...">
  <div id="files"></div>
</div>
<div id="content"></div>
<script>
{% assign mds = site.static_files | where: "extname", ".md" %}
const allFiles = [{% for f in mds %}{{ f.path | remove_first: "/" | jsonify }},{% endfor %}];
const $ = id => document.getElementById(id);
const byDir = {};
allFiles.forEach(p => { if (p.includes("/")) (byDir[p.split("/")[0]] ||= []).push(p); });
const names = Object.keys(byDir).sort();
$("dir").innerHTML = names.map(d => `<option>${d}</option>`).join("");

function renderList() {
  const q = $("filter").value.toLowerCase();
  const cur = location.hash.slice(1);
  $("files").innerHTML = (byDir[$("dir").value] || []).sort()
    .filter(p => p.toLowerCase().includes(q))
    .map(p => `<a href="#${encodeURI(p)}" class="${p === decodeURI(cur) ? "active" : ""}">${p.split("/").slice(1).join("/")}</a>`).join("");
}

async function load() {
  const p = decodeURI(location.hash.slice(1)) || "start.md";
  const d = p.split("/")[0];
  if (byDir[d] && $("dir").value !== d) { $("dir").value = d; }
  renderList();
  try {
    const r = await fetch(encodeURI(p));
    if (!r.ok) throw new Error(r.status);
    $("content").innerHTML = DOMPurify.sanitize(marked.parse(await r.text()));
    $("content").scrollTop = 0;
  } catch (e) {
    $("content").textContent = "Cannot load " + p + ": " + e.message;
  }
}

$("dir").onchange = renderList;
$("filter").oninput = renderList;
window.onhashchange = load;
renderList();
load();
</script>
</body>
</html>
